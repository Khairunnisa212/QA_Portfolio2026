# IMPORTANT: replace the three placeholders below after creating the GitHub repo and deploying to Netlify.
# GitHub backend uses Netlify's OAuth provider. Do not use Git Gateway for a new setup; Netlify documents it as deprecated.
backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/YOUR_REPOSITORY
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
  site_domain: YOUR_SITE_NAME.netlify.app

media_folder: "assets/uploads"
public_folder: "/assets/uploads"
locale: "en"

collections:
  - name: "site"
    label: "Portfolio Website"
    files:
      - name: "portfolio"
        label: "Portfolio Content"
        file: "content/portfolio.json"
        format: "json"
        fields:
          - label: "Profile & Contact"
            name: "profile"
            widget: "object"
            fields:
              - { label: "Browser / SEO Title", name: "siteTitle", widget: "string" }
              - { label: "Full Name", name: "name", widget: "string" }
              - { label: "Professional Role", name: "role", widget: "string" }
              - { label: "Location", name: "location", widget: "string", required: false }
              - { label: "Hero Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Introduction", name: "intro", widget: "text" }
              - { label: "About Me", name: "about", widget: "text" }
              - { label: "Education", name: "education", widget: "string" }
              - { label: "Certification / Training", name: "certification", widget: "string", required: false }
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "Phone", name: "phone", widget: "string", required: false }
              - { label: "LinkedIn URL", name: "linkedin", widget: "string", required: false }
              - { label: "GitHub URL", name: "github", widget: "string", required: false }
              - { label: "CV URL (public file or URL)", name: "cvUrl", widget: "string", required: false }
              - label: "Hero Pills"
                name: "heroPills"
                widget: "list"
                field: { label: "Pill Text", name: "pill", widget: "string" }
              - { label: "Contact Section Heading", name: "footerTitle", widget: "string" }
              - { label: "Contact Section Text", name: "footerText", widget: "text" }

          - label: "Section Headings & Website Copy"
            name: "copy"
            widget: "object"
            fields:
              - { label: "Navigation: Home", name: "navHome", widget: "string" }
              - { label: "Navigation: Skills", name: "navSkills", widget: "string" }
              - { label: "Navigation: Projects", name: "navProjects", widget: "string" }
              - { label: "Navigation: Artifacts", name: "navArtifacts", widget: "string" }
              - { label: "Navigation: About", name: "navAbout", widget: "string" }
              - { label: "Navigation: Contact", name: "navContact", widget: "string" }
              - { label: "Hero Button: Projects", name: "heroProjectsButton", widget: "string" }
              - { label: "Hero Button: Artifacts", name: "heroArtifactsButton", widget: "string" }
              - { label: "Skills Section Eyebrow", name: "skillsKicker", widget: "string" }
              - { label: "Skills Section Title", name: "skillsTitle", widget: "string" }
              - { label: "Skills Section Description", name: "skillsDescription", widget: "text" }
              - { label: "Projects Section Eyebrow", name: "projectsKicker", widget: "string" }
              - { label: "Projects Section Title", name: "projectsTitle", widget: "string" }
              - { label: "Projects Section Description", name: "projectsDescription", widget: "text" }
              - { label: "Artifacts Section Eyebrow", name: "artifactsKicker", widget: "string" }
              - { label: "Artifacts Section Title", name: "artifactsTitle", widget: "string" }
              - { label: "Artifacts Section Description", name: "artifactsDescription", widget: "text" }
              - { label: "Approach Section Eyebrow", name: "approachKicker", widget: "string" }
              - { label: "Approach Section Title", name: "approachTitle", widget: "string" }
              - { label: "Approach Section Description", name: "approachDescription", widget: "text" }
              - { label: "About Section Eyebrow", name: "aboutKicker", widget: "string" }
              - { label: "About Section Title", name: "aboutTitle", widget: "string" }
              - { label: "About Section Description", name: "aboutDescription", widget: "text" }
              - { label: "Contact Section Eyebrow", name: "contactKicker", widget: "string" }
              - { label: "Email Button Text", name: "emailButtonText", widget: "string" }
              - { label: "LinkedIn Button Text", name: "linkedinButtonText", widget: "string" }
              - { label: "GitHub Button Text", name: "githubButtonText", widget: "string" }
              - { label: "Contact Placeholder / Note", name: "contactPlaceholder", widget: "string", required: false }
              - { label: "Footer Note", name: "footerNote", widget: "string" }

          - label: "Skills & Tools"
            name: "skills"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "ID (unique, lowercase, no spaces)", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Skill Tags"
                name: "items"
                widget: "list"
                field: { label: "Skill", name: "skill", widget: "string" }
              - label: "Experience Level"
                name: "level"
                widget: "select"
                options:
                  - { label: "Hands-on / Experience", value: "experience" }
                  - { label: "Learning / Developing", value: "learning" }
              - { label: "Icon (emoji or short symbol)", name: "icon", widget: "string", required: false }

          - label: "Project Case Studies"
            name: "projects"
            widget: "list"
            summary: "{{fields.title}} · {{fields.category}}"
            fields:
              - { label: "ID (unique, lowercase, no spaces)", name: "id", widget: "string" }
              - { label: "Project Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "string" }
              - { label: "Category", name: "category", widget: "string" }
              - label: "Illustration Style"
                name: "visual"
                widget: "select"
                options:
                  - { label: "CCTV / Camera", value: "camera" }
                  - { label: "ERP / Dashboard", value: "erp" }
                  - { label: "Drone / Map", value: "drone" }
                  - { label: "Practice Project", value: "practice" }
              - { label: "Icon", name: "icon", widget: "string", required: false }
              - { label: "Experience Status", name: "status", widget: "string" }
              - label: "Tags"
                name: "tags"
                widget: "list"
                field: { label: "Tag", name: "tag", widget: "string" }
              - label: "Filter IDs"
                name: "tagsFilter"
                widget: "list"
                field: { label: "Filter ID (manual, workflow, planning, edge-cases)", name: "filter", widget: "string" }
              - { label: "Summary", name: "summary", widget: "text" }
              - { label: "My Role", name: "role", widget: "text" }
              - { label: "Challenge", name: "challenge", widget: "text" }
              - label: "Testing Approach"
                name: "approach"
                widget: "list"
                field: { label: "Step", name: "step", widget: "text" }
              - { label: "Key Finding", name: "finding", widget: "text" }
              - { label: "Outcome / Status", name: "outcome", widget: "text" }
              - { label: "Learning", name: "learning", widget: "text" }

          - label: "Testing Artifacts"
            name: "artifacts"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "ID (unique, lowercase, no spaces)", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Status", name: "status", widget: "string" }
              - label: "Example Fields / Table Rows"
                name: "rows"
                widget: "list"
                fields:
                  - { label: "Field Label", name: "field", widget: "string" }
                  - { label: "Example Value", name: "value", widget: "text" }
              - { label: "Optional Public URL", name: "url", widget: "string", required: false }

          - label: "QA Approach Steps"
            name: "approachSteps"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Step Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

          - label: "Work Experience"
            name: "experience"
            widget: "list"
            summary: "{{fields.role}} · {{fields.company}}"
            fields:
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Company", name: "company", widget: "string" }
              - { label: "Period", name: "period", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

          - label: "Organizational Experience"
            name: "organizations"
            widget: "list"
            summary: "{{fields.role}} · {{fields.organization}}"
            fields:
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Organization", name: "organization", widget: "string" }
              - { label: "Period", name: "period", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

          - label: "About Me Tags"
            name: "aboutTags"
            widget: "list"
            field: { label: "Tag", name: "tag", widget: "string" }

          - label: "Appearance Settings"
            name: "appearance"
            widget: "object"
            fields:
              - { label: "Navy (hex color)", name: "navy", widget: "string" }
              - { label: "Navy Secondary (hex color)", name: "navy2", widget: "string" }
              - { label: "Text Color (hex color)", name: "ink", widget: "string" }
              - { label: "Muted Text (hex color)", name: "muted", widget: "string" }
              - { label: "Light Blue (hex color)", name: "sky", widget: "string" }
              - { label: "Secondary Light Blue (hex color)", name: "sky2", widget: "string" }
              - { label: "Border Color (hex color)", name: "line", widget: "string" }
              - { label: "Card Color (hex color)", name: "paper", widget: "string" }
              - { label: "Background Color (hex color)", name: "bg", widget: "string" }
              - { label: "Teal Accent (hex color)", name: "teal", widget: "string" }
              - { label: "Card Corner Radius (px)", name: "radius", widget: "number", value_type: "int", min: 8, max: 36 }
